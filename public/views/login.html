<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POS System - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/pos-custom.css">
</head>

<body class="login-page">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12">

        <div class="card login-card">
          <div class="card-body">

            <div class="brand-icon">
              <i class="bi bi-shield-lock-fill"></i>
            </div>

            <h2 class="text-center fw-bold mb-2">Welcome Back</h2>
            <p class="text-center text-muted mb-4 small">Enter your credentials to access the terminal</p>

            <form id="login-form">

              <div class="mb-3">
                <label class="form-label fw-bold small text-secondary">Username</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                  <input type="text" id="username" class="form-control form-control-lg border-start-0"
                    placeholder="e.g. admin" required>
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-bold small text-secondary">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
                  <input type="password" id="password" class="form-control form-control-lg border-start-0 border-end-0"
                    placeholder="••••••••" required>
                  <button class="btn btn-light border border-start-0 bg-light text-secondary" type="button"
                    onclick="togglePassword('password', this)">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn btn-lg btn-primary w-100 shadow-sm fw-bold">
                Sign In
              </button>

              <div class="text-center mt-4">
                <p class="text-muted small mb-0">Secure System Access &copy; 2026</p>
              </div>

            </form>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>

</html>
